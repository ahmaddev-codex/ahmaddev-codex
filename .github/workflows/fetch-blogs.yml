name: Update README with Engineering Blogs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Fetch and update blogs
        run: npm run fetch-blogs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: update README with latest engineering blogs [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes detected in engineering blog feeds."
          fi